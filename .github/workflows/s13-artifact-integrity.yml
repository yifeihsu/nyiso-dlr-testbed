name: S13 artifact integrity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/s13-artifact-integrity.yml"
      - "run_handoff_reproduction.m"
      - "run_electrical_model_reproduction.m"
      - "run_ny_only_foundation.m"
      - "PROJECT_HANDOFF.md"
      - "LATEST_MODEL_CONFIGURATION.csv"
      - "System Matpower Format/NY_Lite/**"
      - "System Matpower Format/npcc_ny_lite_s7_seven_interface_perform_direct_candidate.m"
      - "System Matpower Format/npcc_ny_lite_s12_perform_retention_core.m"
      - "System Matpower Format/npcc_ny_lite_s13_npcc_augmented_2019.m"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".gitattributes"
      - ".github/workflows/s13-artifact-integrity.yml"
      - "run_handoff_reproduction.m"
      - "run_electrical_model_reproduction.m"
      - "run_ny_only_foundation.m"
      - "PROJECT_HANDOFF.md"
      - "LATEST_MODEL_CONFIGURATION.csv"
      - "System Matpower Format/NY_Lite/**"
      - "System Matpower Format/npcc_ny_lite_s7_seven_interface_perform_direct_candidate.m"
      - "System Matpower Format/npcc_ny_lite_s12_perform_retention_core.m"
      - "System Matpower Format/npcc_ny_lite_s13_npcc_augmented_2019.m"

permissions:
  contents: read

jobs:
  repository-integrity:
    name: S13 registers and structural mutations
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch MATPOWER 8.1
        run: git clone --depth 1 --branch 8.1 https://github.com/MATPOWER/matpower.git "$env:RUNNER_TEMP\matpower"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          products: Optimization_Toolbox

      - name: Validate committed model artifacts
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(genpath(fullfile(getenv('RUNNER_TEMP'), 'matpower')));
            addpath(fullfile(pwd, 'System Matpower Format'));
            addpath(fullfile(pwd, 'System Matpower Format', 'NY_Lite'));
            policy = readtable(fullfile(pwd, 'LATEST_MODEL_CONFIGURATION.csv'), 'TextType', 'string');
            assert(nnz(strcmp(policy.setting, 'structural_provenance_case')) == 1 && nnz(strcmp(policy.setting, 'structural_provenance_case') & strcmp(policy.value, 'npcc_ny_lite_s7_seven_interface_perform_direct_candidate')) == 1);
            assert(nnz(strcmp(policy.setting, 'construction_validation_parent')) == 1 && nnz(strcmp(policy.setting, 'construction_validation_parent') & strcmp(policy.value, 'npcc_ny_lite_s13_npcc_augmented_2019')) == 1);
            assert(nnz(strcmp(policy.setting, 'promoted_operating_case')) == 1 && nnz(strcmp(policy.setting, 'promoted_operating_case') & strcmp(policy.value, 'pending_npcc_ny_lite_s14_nyiso_dlr_operating_model')) == 1);
            assert(nnz(strcmp(policy.setting, 'reference_oracle')) == 1 && nnz(strcmp(policy.setting, 'reference_oracle') & strcmp(policy.value, 'npcc_ny_lite_s12_perform_retention_core')) == 1);
            s14_promotion_scope = strcmp(policy.category, 's14_nyiso') & strcmp(policy.setting, 'promotion_eligible');
            assert(nnz(s14_promotion_scope) == 1 && nnz(s14_promotion_scope & strcmp(policy.value, 'false')) == 1);
            s14_status_scope = strcmp(policy.category, 's14_nyiso') & strcmp(policy.setting, 'status');
            assert(nnz(s14_status_scope) == 1 && nnz(s14_status_scope & strcmp(policy.value, 'ny_only_foundation_candidate')) == 1);
            contract = research_model_contract('historical_actual_mw');
            assert(contract.power_scale == "actual_mw" && ~contract.external_npcc_qualification_required && ~contract.external_reduction_required && ~contract.require_all_original_ny_elements_active && contract.preserve_historical_cases);
            status_names = ["electrical_baseline_qualified", "contemporary_validation_coverage", "dlr_ready"];
            for k = 1:numel(status_names), assert(nnz(strcmp(policy.category, 's14_nyiso') & strcmp(policy.setting, status_names(k))) == 1); end;
            assert(isfile(fullfile(pwd, 'run_ny_only_foundation.m')));
            s7 = loadcase('npcc_ny_lite_s7_seven_interface_perform_direct_candidate');
            assert(~s7.userdata.ny_lite.s7_seven_interface_calibration.promotion_eligible);
            s12 = loadcase('npcc_ny_lite_s12_perform_retention_core');
            assert(~s12.userdata.promotion_eligible);
            s13_full = loadcase('npcc_ny_lite_s13_npcc_augmented_2019');
            assert(strcmp(s13_full.userdata.s13.current_phase, 'phase1b') && isequal([size(s13_full.bus, 1), size(s13_full.branch, 1), size(s13_full.gen, 1)], [149 262 62]));
            assert(strcmp(s13_full.userdata.s13.governing_hierarchy_role, 's13_full_construction_validation_parent') && strcmp(s13_full.userdata.s13.downstream_operating_model, 'npcc_ny_lite_s14_nyiso_dlr_operating_model') && ~s13_full.userdata.s13.dlr_delivery_eligible && ~s13_full.userdata.s13.construction_source_qualified && ~s13_full.userdata.s13.promotion_eligible);
            structural = validate_s13_structural_preservation(struct('write_outputs', false, 'fail_on_structural', true));
            assert(structural.all_structural_gates_pass && ~structural.all_construction_gates_pass && ~structural.construction_source_qualified && ~structural.promotion_eligible);
            artifacts = validate_s13_artifact_consistency(struct('fail_on_mismatch', true));
            assert(artifacts.all_artifacts_match && artifacts.register_artifact_count == 7 && artifacts.structural_ledger_count == 1);
            adversarial = test_s13_structural_validator_adversarial(struct('output_file', fullfile(tempdir, 's13_structural_adversarial_results.csv')));
            assert(adversarial.all_expected_gates_observed);
            s12_sidecar = test_s12_interface_snapshot_sums;
            assert(s12_sidecar.pass && s12_sidecar.total_east_circuit_count == 8);
            oracle = run_s13_phase1a_oracle_comparison(struct('write_outputs', false, 'verbose', false, 'fail_on_incomplete', false));
            assert(oracle.stage_a_pass && ~oracle.common_input_ready && ~oracle.stage_b_executed && ~oracle.stage_c_executed && ~oracle.promotion_eligible);
            oracle_artifacts = validate_s13_phase1a_oracle_artifact_consistency(struct('oracle_result', oracle, 'fail_on_mismatch', true, 'verbose', false));
            assert(oracle_artifacts.all_artifacts_match && oracle_artifacts.artifact_count == 12);
            smoke = validate_s13_phase1a_smoke(struct('write_outputs', false));
            assert(smoke.standard_pf_both_pass);
            phase1b_local = run_s13_phase1b_local_identity(struct('write_outputs', false, 'fail_on_gate', true, 'verbose', false));
            assert(phase1b_local.pass && all(phase1b_local.gate_ledger.pass(phase1b_local.gate_ledger.mandatory)) && phase1b_local.phase1a_report_exact_match && phase1b_local.phase1a_physical_rows_bit_identical && phase1b_local.candidate_fail_closed);
            phase1b_local_test = test_s13_phase1b_local_identity(struct('verbose', false));
            assert(phase1b_local_test.pass && phase1b_local_test.operator_validator_available && phase1b_local_test.operator_mandatory_proxy_pass);
            phase1b_operator = validate_s13_phase1b_upny_operator(struct('write_outputs', false, 'fail_on_gate', true, 'verbose', false));
            phase1b_operator_mandatory = phase1b_operator.gate_ledger.mandatory_for_phase1b_proxy;
            assert(phase1b_operator.pass && phase1b_operator.mandatory_proxy_pass && phase1b_operator.mandatory_proxy_pass_count == 24 && phase1b_operator.mandatory_proxy_gate_count == 24 && all(phase1b_operator.gate_ledger.pass(phase1b_operator_mandatory)) && phase1b_operator.public_gap_pass_count == 0 && phase1b_operator.public_gap_gate_count == 3 && ~phase1b_operator.exact_public_operator && ~phase1b_operator.promotion_eligible);
            phase1b_artifacts = validate_s13_phase1b_artifact_consistency(struct('write_outputs', false, 'fail_on_mismatch', true, 'verbose', false));
            assert(phase1b_artifacts.all_artifacts_match && phase1b_artifacts.matched_artifact_count == 7 && phase1b_artifacts.artifact_count == 7 && phase1b_artifacts.dependency_count == 6 && phase1b_artifacts.passed_dependency_count == 6 && ~phase1b_artifacts.promotion_eligible);
            phase1b_adversarial = test_s13_phase1b_validator_adversarial(struct('output_file', fullfile(tempdir, 's13_phase1b_adversarial_results.csv'), 'write_outputs', true, 'fail_on_unrejected', true, 'verbose', false));
            assert(phase1b_adversarial.all_expected_gates_observed && height(phase1b_adversarial.results) == 9 && nnz(phase1b_adversarial.results.pass) == 9);
            phase1b_smoke = validate_s13_phase1b_smoke(struct('write_outputs', false, 'fail_on_standard_pf', true, 'verbose', false));
            assert(phase1b_smoke.standard_pf_all_pass && height(phase1b_smoke.summary) == 3 && nnz(phase1b_smoke.summary.standard_pf_success) == 3 && ~phase1b_smoke.construction_source_qualified && ~phase1b_smoke.promotion_eligible);

      - name: Preserve optional external-reduction diagnostic regression
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(genpath(fullfile(getenv('RUNNER_TEMP'), 'matpower')));
            electrical = run_electrical_model_reproduction(struct('write_outputs', false, 'run_operating_diagnostic', false));
            assert(all(electrical.tests.passed) && electrical.reduction.direct_passed && electrical.direct.reduction_metrics_passed && ~electrical.promotion_eligible);

      - name: Validate NY-only foundation implementation without operating qualification
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(genpath(fullfile(getenv('RUNNER_TEMP'), 'matpower')));
            addpath(fullfile(pwd, 'System Matpower Format', 'NY_Lite'));
            policy_tests = test_research_model_contract;
            assert(all(policy_tests.passed));
            foundation = run_ny_only_foundation(struct('write_outputs', false, 'run_tests', true, 'run_operating', false));
            assert(all(foundation.tests.passed) && ~foundation.electrical_baseline_qualified);

  ny-only-operating-reference:
    name: NY-only historical operating reference and independent replay
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch MATPOWER 8.1
        run: git clone --depth 1 --branch 8.1 https://github.com/MATPOWER/matpower.git "$env:RUNNER_TEMP\matpower"

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          products: Optimization_Toolbox

      - name: Run full Package A operating experiment
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(genpath(fullfile(getenv('RUNNER_TEMP'), 'matpower')));
            evidence_dir = fullfile(getenv('RUNNER_TEMP'), 'ny_only_package_a');
            foundation = run_ny_only_foundation(struct('output_dir', evidence_dir, 'write_outputs', true, 'run_tests', false, 'run_operating', true));
            assert(isfield(foundation, 'source_snapshot') && isfield(foundation, 'reference'));
            assert(islogical(foundation.electrical_baseline_qualified) && isscalar(foundation.electrical_baseline_qualified) && foundation.electrical_baseline_qualified);
            independent_replay = replay_ny_only_foundation(evidence_dir);
            assert(independent_replay.passed);
            foundation_contract_test = test_ny_foundation_reference; assert(foundation_contract_test.pass);

      - name: Preserve operating experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ny-only-foundation-${{ github.run_id }}
          path: ${{ runner.temp }}/ny_only_package_a/
          if-no-files-found: warn
          retention-days: 14
